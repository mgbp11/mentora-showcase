<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mentora · interactive prototype</title>
<meta name="description" content="Mentora: a personal AI private tutor for ages 2 to 60+. Clickable prototype of the native iOS app.">
<meta name="theme-color" content="#FAF6EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<button id="railToggle" aria-label="Prototype controls">⚙</button>
<aside class="rail" id="rail">
  <div>
    <h1 class="disp">Mentora</h1>
    <p class="sub">Your Private Teacher. For Anything. For Life. Tap through the prototype, it is fully clickable.</p>
  </div>

  <div class="rail-card">
    <div class="rail-lab">Age band</div>
    <div class="seg">
      <button data-r="age:5">Age 5</button><button data-r="age:13">Age 13</button>
      <button data-r="age:20">Age 20</button><button data-r="age:40">Age 40</button>
    </div>
  </div>

  <div class="rail-card">
    <div class="rail-lab">State</div>
    <div class="seg">
      <button data-r="state:first">First-time</button><button data-r="state:active">Active</button>
      <button data-r="state:streak">Streak</button><button data-r="state:goal">Goal done</button>
      <button data-r="state:struggle">Struggling</button>
    </div>
  </div>

  <div class="rail-card">
    <div class="rail-lab">Appearance</div>
    <div class="seg">
      <button data-r="theme:light">Light</button><button data-r="theme:dark">Dark</button>
    </div>
    <div class="rail-lab" style="margin:12px 0 8px">Layout direction</div>
    <div class="seg">
      <button data-r="rtl:false">English</button><button data-r="rtl:true">עברית RTL</button>
    </div>
  </div>

  <div class="rail-card">
    <div class="seg"><button data-r="reset:1" style="flex:1">↺ Start over</button></div>
  </div>

  <p class="hint">This is a web port of a native SwiftUI app, built from the same design tokens and copy.
    <a href="gallery.html">See the real iOS build →</a></p>
</aside>

<main id="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen" id="screen"></div>
  </div>
</main>

<script src="app.js"></script>
<script src="screens.js"></script>
<script src="shell.js"></script>
</body>
</html>
